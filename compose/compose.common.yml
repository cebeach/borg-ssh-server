services:
  borgbackup:
    image: ${IMAGE}
    hostname: borgbackup-server

    labels:
      service: borgbackup

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pgrep -x sshd >/dev/null && test -d /repos && test -w /repos && test -f /etc/ssh/host_keys/ssh_host_ed25519_key"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

